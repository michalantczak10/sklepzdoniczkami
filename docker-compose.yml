version: '3.9'

services:
  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://sklepzdoniczkami:sklepzdoniczkami_dev_pass@db:5432/sklepzdoniczkami_dev
    depends_on:
      - db

  db:
    image: postgres:18
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: sklepzdoniczkami_dev
      POSTGRES_USER: sklepzdoniczkami
      POSTGRES_PASSWORD: sklepzdoniczkami_dev_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
