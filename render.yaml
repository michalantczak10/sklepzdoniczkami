services:
  - type: web
    name: sklepzdoniczkami
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY_PRODUCTION
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "sklepzdoniczkami.pl,sklepzdoniczkami.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://sklepzdoniczkami.pl,https://sklepzdoniczkami.onrender.com"
      - key: SITE_NAME
        value: "Sklepzdoniczkami"
      - key: DATABASE_NAME_PRODUCTION
        value: sklepzdoniczkami_prod
      - key: DATABASE_URL_PRODUCTION
        sync: false
      - key: STRIPE_SECRET_KEY_PRODUCTION
        sync: false
      - key: STRIPE_PUBLIC_KEY_PRODUCTION
        sync: false
      - key: STRIPE_WEBHOOK_SECRET_PRODUCTION
        sync: false

  - type: web
    name: sklepzdoniczkami-preprod
    runtime: python
    plan: free
    branch: dev
    autoDeployTrigger: checksPass
    # Schema changes are applied by the dev workflow with the isolated migration role.
    buildCommand: pip install -r requirements.txt && test -n "$DATABASE_URL_PREPROD" && python manage.py collectstatic --noinput && python manage.py seed_preprod_data
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY_PREPROD
        generateValue: true
      - key: APP_ENV
        value: preprod
      - key: DATABASE_NAME_PREPROD
        value: sklepzdoniczkami_preprod
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "sklepzdoniczkami-preprod.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://sklepzdoniczkami-preprod.onrender.com"
      - key: SITE_NAME
        value: "Sklepzdoniczkami Preprod"
      - key: DATABASE_URL_PREPROD
        sync: false
      - key: STRIPE_SECRET_KEY_PREPROD
        sync: false
      - key: STRIPE_PUBLIC_KEY_PREPROD
        sync: false
      - key: STRIPE_WEBHOOK_SECRET_PREPROD
        sync: false

# Keep Render slugs hyphenated and PostgreSQL environment database names
# underscored. Use environment-suffixed variable names and distinct databases.
