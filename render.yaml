services:
  - type: web
    name: sklepzdoniczkami
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py rename_shop_label && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "sklepzdoniczkami.pl,sklepzdoniczkami.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://sklepzdoniczkami.pl,https://sklepzdoniczkami.onrender.com"
      - key: SITE_NAME
        value: "Sklepzdoniczkami"
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

# Database is hosted externally on Neon (https://neon.tech), not on Render,
# to avoid the 90-day expiry of Render's free Postgres plan.
# DATABASE_URL is set directly as a service env var and is not managed here.
