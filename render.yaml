services:
  - type: web
    name: sklepzdoniczkami
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "sklepzdoniczkami.pl,sklepzdoniczkami.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://sklepzdoniczkami.pl,https://sklepzdoniczkami.onrender.com"
      - key: SITE_NAME
        value: "Sklepzdoniczkami"
      - key: DATABASE_URL
        fromDatabase:
          name: sklepzdoniczkami
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: sklepzdoniczkami
    databaseName: sklepzdoniczkami_otj7
    user: sklepzdoniczkami_user
    plan: free
