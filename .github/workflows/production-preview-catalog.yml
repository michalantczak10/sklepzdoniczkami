name: Add production preview catalogue

on:
  workflow_dispatch:
    inputs:
      confirm_production_preview:
        description: Add synthetic visible products with zero stock
        required: true
        type: choice
        options:
          - do-not-run
          - add-preview-products
        default: do-not-run

permissions:
  contents: read

concurrency:
  group: production-preview-catalog
  cancel-in-progress: false

jobs:
  seed-production-preview:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm_production_preview == 'add-preview-products'
    name: Add non-purchasable sample products to production
    runs-on: ubuntu-24.04
    environment: production
    env:
      APP_ENV: production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
      CSRF_TRUSTED_ORIGINS: https://sklepzdoniczkami.pl,https://sklepzdoniczkami.onrender.com
      SITE_NAME: Sklepzdoniczkami
      DATABASE_NAME_PRODUCTION: sklepzdoniczkami_prod
      DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION_WEB }}
      PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set ephemeral Django key
        run: python -c "import secrets; print('DJANGO_SECRET_KEY_PRODUCTION=' + secrets.token_urlsafe(48))" >> "$GITHUB_ENV"

      - name: Validate production preview target
        env:
          DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION_WEB }}
        run: |
          if [ -z "$DATABASE_URL_PRODUCTION" ] || [ -z "$PRODUCTION_DATABASE_HOST" ]; then
            echo "Production web database URL and expected host are required" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          from urllib.parse import parse_qsl, urlparse

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")

          import django
          import psycopg2
          from django.conf import settings

          django.setup()
          database = settings.DATABASES["default"]
          expected_host = os.environ["PRODUCTION_DATABASE_HOST"].strip()
          if (
              database["ENGINE"] != "django.db.backends.postgresql"
              or database["NAME"] != "sklepzdoniczkami_prod"
              or database["USER"] != "sklepzdoniczkami_prod_web_limited"
              or database["HOST"].lower() != expected_host.lower()
              or database.get("PORT") not in {None, "", 5432, "5432"}
          ):
              raise SystemExit("Configured database does not match the approved production target")

          database_url = urlparse(os.environ["DATABASE_URL_PRODUCTION"])
          routing_options = {
              "database",
              "dbname",
              "host",
              "hostaddr",
              "options",
              "password",
              "port",
              "service",
              "servicefile",
              "target_session_attrs",
              "load_balance_hosts",
              "user",
          }
          query_keys = {
              key.lower()
              for key, _ in parse_qsl(database_url.query, keep_blank_values=True)
          }
          if (
              database_url.scheme not in {"postgres", "postgresql"}
              or database_url.path.lstrip("/").split("?")[0] != "sklepzdoniczkami_prod"
              or (database_url.hostname or "").lower() != expected_host.lower()
              or database_url.username != "sklepzdoniczkami_prod_web_limited"
              or routing_options.intersection(query_keys)
          ):
              raise SystemExit("Production URL does not match the approved database and role")

          with psycopg2.connect(
              os.environ["DATABASE_URL_PRODUCTION"],
              connect_timeout=15,
              options="-c default_transaction_read_only=on",
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT current_database(), current_user, current_schema(), "
                      "EXISTS ("
                      "SELECT 1 FROM pg_namespace AS namespace "
                      "WHERE left(namespace.nspname, 3) <> 'pg_' "
                      "AND namespace.nspname <> 'information_schema' "
                      "AND has_schema_privilege(current_user, namespace.oid, 'CREATE')"
                      "), "
                      "has_database_privilege(current_user, current_database(), 'CREATE'), "
                      "rolcreatedb, rolcreaterole, rolsuper, rolreplication, rolbypassrls, "
                      "EXISTS ("
                      "SELECT 1 FROM pg_roles AS granted_role "
                      "WHERE granted_role.rolname <> current_user "
                      "AND pg_has_role(current_user, granted_role.oid, 'MEMBER') "
                      "AND (granted_role.rolsuper OR granted_role.rolcreatedb "
                      "OR granted_role.rolcreaterole OR granted_role.rolreplication "
                      "OR granted_role.rolbypassrls "
                      "OR granted_role.rolname::text = ANY(%s))"
                      ") "
                      "FROM pg_roles WHERE rolname = current_user",
                      (
                          [
                              "neon_superuser",
                              "pg_execute_server_program",
                              "pg_read_all_data",
                              "pg_read_server_files",
                              "pg_signal_backend",
                              "pg_write_all_data",
                              "pg_write_server_files",
                          ],
                      ),
                  )
                  row = cursor.fetchone()
                  database_name, database_user, schema_name = row[:3]
                  (
                      can_create_objects,
                      can_create_schemas,
                      can_create_databases,
                      can_create_roles,
                      is_superuser,
                      can_replicate,
                      can_bypass_row_security,
                      has_elevated_membership,
                  ) = row[3:]
          if (
              database_name != "sklepzdoniczkami_prod"
              or database_user != "sklepzdoniczkami_prod_web_limited"
              or schema_name != "public"
          ):
              raise SystemExit("Live connection did not match the approved production target")
          if can_create_objects or can_create_schemas or any(
              (
                  can_create_databases,
                  can_create_roles,
                  is_superuser,
                  can_replicate,
                  can_bypass_row_security,
                  has_elevated_membership,
              )
          ):
              raise SystemExit("Production runtime role has excessive database privileges")
          PY

      - name: Add preview products with zero stock
        run: python manage.py seed_production_preview_catalog --confirm-production-preview

      - name: Record production preview catalogue operation
        run: |
          {
            echo "Added the synthetic preview catalogue to production."
            echo "All created products have zero stock and cannot be purchased."
            echo "No orders, customers, or production products were changed."
          } >> "$GITHUB_STEP_SUMMARY"
