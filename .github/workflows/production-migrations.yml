name: Production database migrations

on:
  workflow_dispatch:
    inputs:
      target_state:
        description: Identify the verified production target state
        required: true
        type: choice
        options:
          - not-confirmed
          - existing-production
          - verified-empty-bootstrap
        default: not-confirmed
      legacy_data_disposition:
        description: For empty bootstrap, confirm legacy SQLite data is intentionally discarded
        required: true
        type: choice
        options:
          - not-confirmed
          - intentionally-discarded
        default: not-confirmed
      backup_restore_verified:
        description: For existing production only, confirm a production backup was separately restored and verified
        required: true
        type: choice
        options:
          - not-verified
          - verified
        default: not-verified
      confirm_migration:
        description: Confirm the production migration
        required: true
        type: choice
        options:
          - do-not-run
          - migrate-production
        default: do-not-run

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  production-migrations:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm_migration == 'migrate-production' &&
      (
        (
          inputs.target_state == 'existing-production' &&
          inputs.backup_restore_verified == 'verified'
        ) ||
        (
          inputs.target_state == 'verified-empty-bootstrap' &&
          inputs.legacy_data_disposition == 'intentionally-discarded'
        )
      )
    name: Back up and migrate production database
    runs-on: ubuntu-24.04
    environment: production
    env:
      APP_ENV: production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
      CSRF_TRUSTED_ORIGINS: https://sklepzdoniczkami.pl,https://sklepzdoniczkami.onrender.com
      SITE_NAME: Sklepzdoniczkami
      DATABASE_NAME_PRODUCTION: sklepzdoniczkami_prod
      DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION_MIGRATE }}
      PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
      PRODUCTION_TARGET_STATE: ${{ inputs.target_state }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_HMAC_KEY: ${{ secrets.BACKUP_HMAC_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set ephemeral Django key
        run: python -c "import secrets; print('DJANGO_SECRET_KEY_PRODUCTION=' + secrets.token_urlsafe(48))" >> "$GITHUB_ENV"

      - name: Validate production migration target
        run: |
          if [ -z "$DATABASE_URL_PRODUCTION" ] || [ -z "$PRODUCTION_DATABASE_HOST" ]; then
            echo "Production migration URL and expected database host are required" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          import psycopg2

          database_url = urlparse(os.environ["DATABASE_URL_PRODUCTION"])
          if database_url.scheme not in {"postgres", "postgresql"}:
              raise SystemExit("Production migration target must use PostgreSQL")
          if database_url.path.lstrip("/").split("?")[0] != "sklepzdoniczkami_prod":
              raise SystemExit("Production migration target must be sklepzdoniczkami_prod")
          expected_host = os.environ["PRODUCTION_DATABASE_HOST"]
          if (database_url.hostname or "").lower() != expected_host.lower():
              raise SystemExit(
                  "Production migration target does not match the approved database host"
              )
          if database_url.username != "sklepzdoniczkami_prod_migrate_limited":
              raise SystemExit("Production migration target must use the limited migration role")

          with psycopg2.connect(
              os.environ["DATABASE_URL_PRODUCTION"],
              connect_timeout=15,
              options="-c default_transaction_read_only=on",
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT current_database(), current_user, "
                      "has_schema_privilege(current_user, 'public', 'CREATE'), "
                      "rolcreatedb, rolcreaterole, rolsuper, rolreplication, "
                      "pg_has_role(current_user, 'neon_superuser', 'MEMBER') "
                      "FROM pg_roles WHERE rolname = current_user"
                  )
                  (
                      database_name,
                      database_user,
                      can_create_objects,
                      can_create_databases,
                      can_create_roles,
                      is_superuser,
                      can_replicate,
                      is_neon_superuser,
                  ) = cursor.fetchone()
                  cursor.execute(
                      "SELECT EXISTS ("
                      "SELECT 1 FROM information_schema.tables "
                      "WHERE table_schema = 'public' AND table_name = 'django_migrations'"
                      ")"
                  )
                  has_migration_history = cursor.fetchone()[0]
                  cursor.execute(
                      "SELECT count(*) FROM pg_catalog.pg_class AS relation "
                      "JOIN pg_catalog.pg_namespace AS namespace "
                      "ON namespace.oid = relation.relnamespace "
                      "WHERE namespace.nspname = 'public' "
                      "AND relation.relkind IN ('r', 'p', 'S', 'v', 'm', 'f')"
                  )
                  public_relation_count = cursor.fetchone()[0]
                  cursor.execute(
                      "SELECT count(*) FROM pg_catalog.pg_class AS relation "
                      "JOIN pg_catalog.pg_namespace AS namespace "
                      "ON namespace.oid = relation.relnamespace "
                      "WHERE namespace.nspname = 'public' "
                      "AND relation.relkind IN ('r', 'p', 'S', 'v', 'm', 'f') "
                      "AND pg_catalog.pg_get_userbyid(relation.relowner) <> current_user"
                  )
                  unowned_public_relation_count = cursor.fetchone()[0]
                  if has_migration_history:
                      cursor.execute("SELECT count(*) FROM public.django_migrations")
                      migration_count = cursor.fetchone()[0]
                  else:
                      migration_count = 0
          if database_name != "sklepzdoniczkami_prod":
              raise SystemExit("Connected to an unexpected production database")
          if not can_create_objects:
              raise SystemExit(
                  "Production migration role cannot create objects in the public schema"
              )
          if any(
              (
                  can_create_databases,
                  can_create_roles,
                  is_superuser,
                  can_replicate,
                  is_neon_superuser,
              )
          ):
              raise SystemExit("Production migration role has excessive privileges")
          target_state = os.environ["PRODUCTION_TARGET_STATE"]
          if target_state == "existing-production" and (
              not has_migration_history or migration_count == 0
          ):
              raise SystemExit(
                  "Existing production target must have applied migration history"
              )
          if target_state == "existing-production" and unowned_public_relation_count != 0:
              raise SystemExit(
                  "Migration role must own all public tables, sequences, and views"
              )
          if target_state == "verified-empty-bootstrap" and public_relation_count != 0:
              raise SystemExit(
                  "Empty bootstrap target must not contain public database objects"
              )
          if target_state not in {"existing-production", "verified-empty-bootstrap"}:
              raise SystemExit("Production target state must be explicitly selected")
          PY

      - name: Record empty-bootstrap data disposition
        if: inputs.target_state == 'verified-empty-bootstrap'
        run: |
          {
            echo "Production target: verified empty Neon bootstrap."
            echo "Legacy SQLite data: intentionally discarded; no legacy records will be imported."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Back up and encrypt the migration target
        run: |
          set -euo pipefail
          for name in BACKUP_ENCRYPTION_KEY BACKUP_HMAC_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "$name secret is required before production migrations" >&2
              exit 1
            fi
          done

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env DATABASE_URL_PRODUCTION \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            postgres:18 sh -euc \
            'pg_dump --dbname="$DATABASE_URL_PRODUCTION" --format=custom --file=production-before-migration.dump'

          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in production-before-migration.dump \
            -out production-before-migration.dump.enc \
            -pass env:BACKUP_ENCRYPTION_KEY

          key_hex=$(printf '%s' "$BACKUP_HMAC_KEY" | base64 -d | xxd -p -c 256)
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$key_hex" \
            -binary production-before-migration.dump.enc |
            xxd -p -c 256 > production-before-migration.dump.enc.hmac
          printf '%s' "$BACKUP_HMAC_KEY" | base64 -d |
            openssl dgst -sha256 -hex | awk '{print substr($2, 1, 8)}' \
            > production-before-migration.hmac.keyid

          tar czf "production-before-migration-${GITHUB_RUN_ID}.tgz" \
            production-before-migration.dump.enc \
            production-before-migration.dump.enc.hmac \
            production-before-migration.hmac.keyid

      - name: Upload encrypted pre-migration backup
        uses: actions/upload-artifact@v7
        with:
          name: production-before-migration-${{ github.run_id }}.tgz
          path: production-before-migration-${{ github.run_id }}.tgz
          retention-days: 90

      - name: Rename legacy Django app metadata
        run: python manage.py rename_shop_label

      - name: Apply production migrations
        run: python manage.py migrate --noinput

      - name: Remove temporary backup files
        if: always()
        run: |
          shred -u production-before-migration.dump 2>/dev/null || rm -f production-before-migration.dump
          rm -f production-before-migration.dump.enc production-before-migration.dump.enc.hmac
          rm -f production-before-migration.hmac.keyid
          rm -f "production-before-migration-${GITHUB_RUN_ID}.tgz"
