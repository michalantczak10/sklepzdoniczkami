name: Verify staging DB

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run verification queries using postgres:18 psql
        env:
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          if [ -z "$DATABASE_URL_STAGING" ]; then echo "DATABASE_URL_STAGING not set"; exit 1; fi
          echo "Running verification queries against $DATABASE_URL_STAGING"
          docker run --rm -e DATABASE_URL_STAGING="$DATABASE_URL_STAGING" postgres:18 sh -c "psql \"$DATABASE_URL_STAGING\" -c \"SELECT 'product_count' as metric, count(*) FROM sklepzdoniczkami_product;\" -c \"SELECT 'order_count' as metric, count(*) FROM sklepzdoniczkami_order;\" -c \"SELECT 'orderitem_count' as metric, count(*) FROM sklepzdoniczkami_orderitem;\" -c \"SELECT 'user_count' as metric, count(*) FROM auth_user;\" -c \"SELECT 'now' as metric, now();\" -c \"SELECT 'pg_version' as metric, version();\""

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: verify-staging-output
          path: |
            ${{ github.workspace }}/verify-output || true
