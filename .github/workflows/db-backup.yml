name: Daily encrypted database backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check required secrets
        env:
          DATABASE_URL_PRODUCTION_BACKUP: ${{ secrets.DATABASE_URL_PRODUCTION_BACKUP }}
          PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
          BACKUP_ENCRYPTION_KEY_PRODUCTION: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_HMAC_KEY_PRODUCTION: ${{ secrets.BACKUP_HMAC_KEY }}
        run: |
          set -euo pipefail
          for name in DATABASE_URL_PRODUCTION_BACKUP PRODUCTION_DATABASE_HOST BACKUP_ENCRYPTION_KEY_PRODUCTION BACKUP_HMAC_KEY_PRODUCTION; do
            if [ -z "${!name:-}" ]; then
              echo "$name secret is required" >&2
              exit 1
            fi
          done

      - name: Dump and encrypt database
        env:
          DATABASE_URL_PRODUCTION_BACKUP: ${{ secrets.DATABASE_URL_PRODUCTION_BACKUP }}
          PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
          BACKUP_ENCRYPTION_KEY_PRODUCTION: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_HMAC_KEY_PRODUCTION: ${{ secrets.BACKUP_HMAC_KEY }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env DATABASE_URL_PRODUCTION_BACKUP \
            --env PRODUCTION_DATABASE_HOST \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            postgres:18 sh -euc \
            '
            : "${PRODUCTION_DATABASE_HOST:?Production Neon host pin is required}"
            connection_authority=${DATABASE_URL_PRODUCTION_BACKUP#*://}
            connection_authority=${connection_authority##*@}
            actual_host=${connection_authority%%/*}
            actual_host=${actual_host%%\?*}
            if [ "$actual_host" != "$PRODUCTION_DATABASE_HOST" ]; then
              echo "Backup URL does not point to the pinned production Neon endpoint." >&2
              exit 1
            fi
            actual_database=$(psql "$DATABASE_URL_PRODUCTION_BACKUP" -Atqc "SELECT current_database()")
            if [ "$actual_database" != "sklepzdoniczkami_prod" ]; then
              echo "Backup URL does not point to sklepzdoniczkami_prod." >&2
              exit 1
            fi
            psql "$DATABASE_URL_PRODUCTION_BACKUP" -v ON_ERROR_STOP=1 -c "SELECT 1 FROM public.django_migrations LIMIT 0" >/dev/null
            psql "$DATABASE_URL_PRODUCTION_BACKUP" -v ON_ERROR_STOP=1 -c "SELECT 1 FROM public.sklepzdoniczkami_product LIMIT 0" >/dev/null
            pg_dump --dbname="$DATABASE_URL_PRODUCTION_BACKUP" --format=custom --file=backup.dump
            '

          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in backup.dump -out backup.dump.enc \
            -pass env:BACKUP_ENCRYPTION_KEY_PRODUCTION

          key_hex=$(printf '%s' "$BACKUP_HMAC_KEY_PRODUCTION" | base64 -d | xxd -p -c 256)
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$key_hex" \
            -binary backup.dump.enc | xxd -p -c 256 > backup.dump.enc.hmac
          printf '%s' "$BACKUP_HMAC_KEY_PRODUCTION" | base64 -d |
            openssl dgst -sha256 -hex | awk '{print substr($2, 1, 8)}' \
            > backup.hmac.keyid

          tar czf "$GITHUB_WORKSPACE/db-backup-files-${GITHUB_RUN_ID}.tgz" \
            -C "$GITHUB_WORKSPACE" \
            backup.dump.enc backup.dump.enc.hmac backup.hmac.keyid

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v7
        with:
          name: db-backup-package-${{ github.run_id }}.tgz
          path: db-backup-files-${{ github.run_id }}.tgz
          retention-days: 90

      - name: Remove temporary backup files
        if: always()
        run: |
          shred -u backup.dump 2>/dev/null || rm -f backup.dump
          rm -f backup.dump.enc backup.dump.enc.hmac backup.hmac.keyid
          rm -f "db-backup-files-${GITHUB_RUN_ID}.tgz"
