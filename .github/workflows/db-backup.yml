name: Daily Encrypted Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y docker.io openssl || true

      - name: Dump Postgres database (custom format)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Creating dump using postgres:18 docker image..."
          docker run --rm -v "$GITHUB_WORKSPACE":/work -w /work postgres:18 pg_dump --dbname="$DATABASE_URL" -Fc -f backup.dump

      - name: Encrypt dump and compute HMAC (v1) and create AES-GCM (v2)
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_HMAC_KEY: ${{ secrets.BACKUP_HMAC_KEY }}
        run: |
          echo "Encrypting dump..."
          set -o pipefail
          if [ ! -f backup.dump ]; then echo "ERROR: backup.dump not found"; ls -la; exit 1; fi
          if [ -z "${BACKUP_ENCRYPTION_KEY:-}" ]; then echo "BACKUP_ENCRYPTION_KEY not set" >&2; exit 1; fi
          # v1: AES-CBC + HMAC (backward-compatible)
          openssl enc -aes-256-cbc -pbkdf2 -salt -in backup.dump -out backup.dump.enc -pass env:BACKUP_ENCRYPTION_KEY
          echo "Encrypted file size:"; ls -lh backup.dump.enc || true
          if [ -z "${BACKUP_HMAC_KEY:-}" ]; then echo "BACKUP_HMAC_KEY not set" >&2; exit 1; fi
          # compute HMAC using raw key decoded from base64 BACKUP_HMAC_KEY
          key_hex=$(echo -n "$BACKUP_HMAC_KEY" | base64 -d | xxd -p -c 256)
          openssl dgst -sha256 -mac HMAC -macopt hexkey:$key_hex -binary backup.dump.enc | xxd -p -c 256 > backup.dump.enc.hmac
          echo "HMAC written to backup.dump.enc.hmac (size: $(wc -c < backup.dump.enc.hmac) bytes)"
          # verify hmac non-empty
          if [ ! -s backup.dump.enc.hmac ]; then echo "ERROR: backup.dump.enc.hmac is empty"; ls -la; exit 1; fi
          # record short key identifier (first 8 hex chars of sha256(key)) to help restore pick matching artifact
          key_id=$(echo -n "$BACKUP_HMAC_KEY" | base64 -d | openssl dgst -sha256 -hex | awk '{print $2}' | cut -c1-8)
          echo "$key_id" > backup.hmac.keyid
          if [ ! -s backup.hmac.keyid ]; then echo "ERROR: failed to write backup.hmac.keyid"; ls -la; exit 1; fi
          echo "Wrote key id: $(cat backup.hmac.keyid)"
          # v2: AES-GCM AEAD (preferred). Note: requires openssl with AES-GCM support on runner.
          openssl enc -aes-256-gcm -pbkdf2 -salt -in backup.dump -out backup.dump.v2.enc -pass env:BACKUP_ENCRYPTION_KEY || true
          if [ -f backup.dump.v2.enc ]; then echo "Created AES-GCM v2 encrypted file"; ls -lh backup.dump.v2.enc || true; fi

      - name: Verify files exist
        run: |
          echo "Checking encrypted files..."
          # at least one format must exist
          if [ -f backup.dump.v2.enc ]; then echo "OK: v2 AES-GCM present"; ls -lh backup.dump.v2.enc; elif [ -f backup.dump.enc ] && [ -f backup.dump.enc.hmac ]; then echo "OK: v1 AES-CBC+HMAC present"; ls -lh backup.dump.enc backup.dump.enc.hmac; else echo "ERROR: no encrypted backup produced"; ls -la; exit 1; fi

      - name: Debug before upload (show keyid/hmac)
        run: |
          echo "=== Debug: listing current directory ==="
          ls -la || true
          echo "=== Check backup.hmac.keyid ==="
          if [ -f backup.hmac.keyid ]; then echo "backup.hmac.keyid exists:"; cat backup.hmac.keyid; else echo "backup.hmac.keyid MISSING"; fi
          stat --printf="keyid: %s bytes\n" backup.hmac.keyid 2>/dev/null || true
          echo "=== Check backup.dump.enc.hmac ==="
          if [ -f backup.dump.enc.hmac ]; then echo "backup.dump.enc.hmac size:"; wc -c backup.dump.enc.hmac; echo "contents:"; cat backup.dump.enc.hmac; else echo "backup.dump.enc.hmac MISSING"; fi
          echo "=== Recursive ls ==="
          ls -R || true

      - name: Upload artifacts (encrypted + hmac if present)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}.enc
          path: |
            backup.dump.v2.enc
            backup.dump.enc
            backup.dump.enc.hmac
            backup.hmac.keyid

      - name: Cleanup
        run: |
          echo "Cleaning up local files"
          shred -u backup.dump || rm -f backup.dump
          shred -u backup.dump.enc || rm -f backup.dump.enc
          shred -u backup.dump.enc.hmac || rm -f backup.dump.enc.hmac
          shred -u backup.dump.v2.enc || rm -f backup.dump.v2.enc
