name: Daily encrypted database backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION || secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_HMAC_KEY: ${{ secrets.BACKUP_HMAC_KEY }}
        run: |
          set -euo pipefail
          for name in DATABASE_URL BACKUP_ENCRYPTION_KEY BACKUP_HMAC_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "$name secret is required" >&2
              exit 1
            fi
          done

      - name: Dump and encrypt database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION || secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_HMAC_KEY: ${{ secrets.BACKUP_HMAC_KEY }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env DATABASE_URL \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            postgres:18 sh -euc \
            'pg_dump --dbname="$DATABASE_URL" --format=custom --file=backup.dump'

          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in backup.dump -out backup.dump.enc \
            -pass env:BACKUP_ENCRYPTION_KEY

          key_hex=$(printf '%s' "$BACKUP_HMAC_KEY" | base64 -d | xxd -p -c 256)
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$key_hex" \
            -binary backup.dump.enc | xxd -p -c 256 > backup.dump.enc.hmac
          printf '%s' "$BACKUP_HMAC_KEY" | base64 -d |
            openssl dgst -sha256 -hex | awk '{print substr($2, 1, 8)}' \
            > backup.hmac.keyid

          tar czf "$GITHUB_WORKSPACE/db-backup-files-${GITHUB_RUN_ID}.tgz" \
            -C "$GITHUB_WORKSPACE" \
            backup.dump.enc backup.dump.enc.hmac backup.hmac.keyid

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v7
        with:
          name: db-backup-package-${{ github.run_id }}.tgz
          path: db-backup-files-${{ github.run_id }}.tgz
          retention-days: 90

      - name: Remove temporary backup files
        if: always()
        run: |
          shred -u backup.dump 2>/dev/null || rm -f backup.dump
          rm -f backup.dump.enc backup.dump.enc.hmac backup.hmac.keyid
          rm -f "db-backup-files-${GITHUB_RUN_ID}.tgz"
