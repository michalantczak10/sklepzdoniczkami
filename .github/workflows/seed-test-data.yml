name: Seed example data for backups

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Insert sample data into DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then echo "DATABASE_URL secret not set" >&2; exit 1; fi
          echo "Creating sample tables and inserting rows (users, products)"
          export PGPASSWORD="$(echo $DATABASE_URL | sed -n 's#.*://[^:]*:\([^@]*\)@.*#\1#p')"
          # Use psql with connection string to run SQL safely
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS users (
            id SERIAL PRIMARY KEY,
            email TEXT UNIQUE,
            name TEXT
          );
          CREATE TABLE IF NOT EXISTS products (
            id SERIAL PRIMARY KEY,
            sku TEXT UNIQUE,
            name TEXT
          );
          INSERT INTO users (email, name) VALUES ('seed.user@example.com', 'Seed User') ON CONFLICT (email) DO NOTHING;
          INSERT INTO products (sku, name) VALUES ('SEED-001','Seed Product') ON CONFLICT (sku) DO NOTHING;
          SELECT 'Inserted users:' as tag, count(*) FROM users;
          SELECT 'Inserted products:' as tag, count(*) FROM products;
          SQL

      - name: Report
        run: echo "Seeding complete"