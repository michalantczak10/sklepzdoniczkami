name: Nightly Test Restore

on:
  schedule:
    - cron: '0 3 1 */1 *' # monthly on day 1 at 03:00 UTC (~30 days)
  workflow_dispatch:

jobs:
  test-restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip openssl docker.io jq

      - name: Run restore workflow (call restore-staging)
        uses: peter-evans/workflow-dispatch@v1
        with:
          workflow: restore-staging.yml
          repo: ${{ github.repository }}
          ref: main
          inputs: |
            backup_artifact_run: ''

      - name: Report
        run: echo "Triggered restore-staging workflow for monthly test."
