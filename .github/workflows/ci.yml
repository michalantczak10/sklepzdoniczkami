name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  APP_ENV: development
  DJANGO_SECRET_KEY_DEVELOPMENT: ci-test-secret-key
  STRIPE_SECRET_KEY_DEVELOPMENT: sk_test_dummy
  STRIPE_PUBLIC_KEY_DEVELOPMENT: pk_test_dummy
  STRIPE_WEBHOOK_SECRET_DEVELOPMENT: whsec_dummy
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1
  CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
  SITE_NAME: Sklepzdoniczkami

jobs:
  test:
    name: Django tests (Neon dev)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify Neon dev read-only connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEVELOPMENT_RO }}
          EXPECTED_DATABASE_NAME: ${{ secrets.DATABASE_NAME_DEVELOPMENT }}
        run: |
          python - <<'PY'
          import os
          import psycopg2

          database_url = os.environ.get("DATABASE_URL")
          if not database_url:
              raise SystemExit("DATABASE_URL_DEVELOPMENT_RO is required")

          with psycopg2.connect(database_url, connect_timeout=15) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT current_database(), current_user, "
                      "has_table_privilege(current_user, 'public.django_migrations', 'SELECT')"
                  )
                  database_name, database_user, can_read_migrations = cursor.fetchone()

          expected_database = os.environ.get("EXPECTED_DATABASE_NAME")
          if database_name != expected_database:
              raise SystemExit(
                  f"Connected to unexpected database {database_name!r}; "
                  f"expected {expected_database!r}"
              )
          if "_ro" not in database_user:
              raise SystemExit("Neon connectivity check did not use a read-only role")
          if not can_read_migrations:
              raise SystemExit("Neon read-only role cannot read Django migration metadata")
          print(f"Connected to Neon development database {database_name} using a read-only role.")
          PY

      - name: Run Django check
        run: python manage.py check

      - name: Check for missing migrations
        env:
          DATABASE_URL_DEVELOPMENT: ${{ secrets.DATABASE_URL_DEVELOPMENT }}
          DATABASE_NAME_DEVELOPMENT: ${{ secrets.DATABASE_NAME_DEVELOPMENT }}
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        env:
          DATABASE_URL_DEVELOPMENT: ${{ secrets.DATABASE_URL_DEVELOPMENT_TEST }}
          DATABASE_NAME_DEVELOPMENT: ${{ secrets.DATABASE_NAME_DEVELOPMENT }}
          DJANGO_TEST_DATABASE_NAME: test_sklepzdoniczkami_dev_${{ github.run_id }}_${{ github.run_attempt }}
        run: pytest -q --ds=config.settings

      - name: Remove any remaining Neon test database
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEVELOPMENT_TEST }}
          DJANGO_TEST_DATABASE_NAME: test_sklepzdoniczkami_dev_${{ github.run_id }}_${{ github.run_attempt }}
        run: python scripts/drop_test_database.py

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Configure environment for e2e
        run: |
          echo "DATABASE_URL_DEVELOPMENT=${{ secrets.DATABASE_URL_DEVELOPMENT_TEST }}" >> $GITHUB_ENV
          echo "DATABASE_NAME_DEVELOPMENT=${{ secrets.DATABASE_NAME_DEVELOPMENT }}" >> $GITHUB_ENV
          echo "DJANGO_TEST_DATABASE_NAME=test_sklepzdoniczkami_dev_${{ github.run_id }}_${{ github.run_attempt }}" >> $GITHUB_ENV

      - name: Run end-to-end tests
        run: pytest e2e -m e2e --browser chromium --ds=config.settings

      - name: Remove any remaining Neon e2e test database
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEVELOPMENT_TEST }}
          DJANGO_TEST_DATABASE_NAME: test_sklepzdoniczkami_dev_${{ github.run_id }}_${{ github.run_attempt }}
        run: python scripts/drop_test_database.py

  preprod-migrations:
    name: Preprod database migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    needs: [test, e2e]
    environment: preprod
    env:
      APP_ENV: preprod
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
      CSRF_TRUSTED_ORIGINS: https://sklepzdoniczkami-preprod.onrender.com
      SITE_NAME: Sklepzdoniczkami Preprod
      DATABASE_NAME_PREPROD: sklepzdoniczkami_preprod
      DATABASE_URL_PREPROD: ${{ secrets.DATABASE_URL_PREPROD_MIGRATE }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set ephemeral Django key
        run: python -c "import secrets; print('DJANGO_SECRET_KEY_PREPROD=' + secrets.token_urlsafe(48))" >> "$GITHUB_ENV"

      - name: Apply preprod migrations
        run: |
          if [ -z "$DATABASE_URL_PREPROD" ]; then
            echo "DATABASE_URL_PREPROD_MIGRATE is required in the preprod environment" >&2
            exit 1
          fi
          python manage.py migrate --noinput
