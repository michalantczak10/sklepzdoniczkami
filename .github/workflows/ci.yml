name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  APP_ENV: development
  DJANGO_SECRET_KEY_DEVELOPMENT: ci-test-secret-key
  STRIPE_SECRET_KEY_DEVELOPMENT: sk_test_dummy
  STRIPE_PUBLIC_KEY_DEVELOPMENT: pk_test_dummy
  STRIPE_WEBHOOK_SECRET_DEVELOPMENT: whsec_dummy
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1
  CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
  SITE_NAME: Sklepzdoniczkami

jobs:
  test:
    name: Django tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate local Compose configuration
        run: docker compose config --quiet

      - name: Run Django check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests with SQLite
        run: pytest -q --ds=config.settings_test

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run end-to-end tests with SQLite
        run: pytest e2e -m e2e --browser chromium --ds=config.settings_test
