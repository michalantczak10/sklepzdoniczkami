name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  APP_ENV: development
  DJANGO_SECRET_KEY_DEVELOPMENT: ci-test-secret-key
  STRIPE_SECRET_KEY_DEVELOPMENT: sk_test_dummy
  STRIPE_PUBLIC_KEY_DEVELOPMENT: pk_test_dummy
  STRIPE_WEBHOOK_SECRET_DEVELOPMENT: whsec_dummy
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1
  CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
  SITE_NAME: Sklepzdoniczkami

jobs:
  test:
    name: Django tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check shell script syntax
        run: |
          bash -n scripts/setup_ubuntu_selfhost.sh
          bash -n scripts/deploy_ovh.sh

      - name: Check PowerShell script syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('scripts/deploy_ovh.ps1', 'scripts/test_ovh_store.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$path has PowerShell syntax errors: $errors"
            }
          }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Django check
        run: python manage.py check --settings=config.settings_test

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Run Django tests with SQLite
        run: pytest -q --ds=config.settings_test

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run end-to-end tests with SQLite
        run: pytest e2e -m e2e --browser chromium --ds=config.settings_test

  postgresql:
    name: PostgreSQL tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sklepzdoniczkami_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sklepzdoniczkami_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test_postgresql
      DJANGO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sklepzdoniczkami_test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests with PostgreSQL
        run: pytest -q --ds=config.settings_test_postgresql
