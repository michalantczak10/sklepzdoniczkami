name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  APP_ENV: development
  DJANGO_SECRET_KEY: ci-test-secret-key
  DATABASE_URL: postgres://test_user:test_pass@127.0.0.1:5432/test_db
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1
  CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
  SITE_NAME: Sklepzdoniczkami
  STRIPE_SECRET_KEY: sk_test_dummy
  STRIPE_PUBLIC_KEY: pk_test_dummy
  STRIPE_WEBHOOK_SECRET: whsec_dummy

jobs:
  test:
    name: Django tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Django check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest -q

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-24.04
    needs: test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pytest e2e -m e2e --browser chromium
