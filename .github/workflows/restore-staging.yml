name: Restore latest DB backup to staging

on: [workflow_dispatch]

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip openssl postgresql-client python3 python3-venv python3-pip

      - name: Download latest db-backup artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Installing jq"
          sudo apt-get update -y && sudo apt-get install -y jq
          echo "Listing artifacts via GitHub API (per_page=100)"
          resp=$(curl -sS -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100")
          ZIP_URL=$(echo "$resp" | jq -r '.artifacts | map(select(.name|startswith("db-backup-"))) | if length==0 then "" else (max_by(.created_at) | .archive_download_url) end')
          if [ -z "$ZIP_URL" ]; then echo "No db-backup artifact found" >&2; exit 2; fi
          echo "Downloading artifact from $ZIP_URL"
          curl -sS -H "Authorization: token $GITHUB_TOKEN" -L "$ZIP_URL" -o artifact.zip
          echo "Downloaded artifact.zip ($(stat -c%s artifact.zip) bytes)"
      - name: Unpack artifact
        run: |
          unzip -l artifact.zip || true
          unzip -o artifact.zip

      - name: Decrypt backup
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ ! -f backup.dump.enc ]; then echo "No backup.dump.enc found"; ls -la; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in backup.dump.enc -out backup.dump -pass env:BACKUP_ENCRYPTION_KEY
          ls -lh backup.dump

      - name: Restore to staging (use postgres:18 docker pg_restore)
        env:
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          if [ -z "$DATABASE_URL_STAGING" ]; then echo "DATABASE_URL_STAGING not set"; exit 1; fi
          echo "Running pg_restore using postgres:18 image"
          # run pg_restore inside postgres:18 so binary versions match; mount workspace
          # pass DATABASE_URL into the container as an env var to avoid exposing it in the host command line
          docker run --rm -e DATABASE_URL="$DATABASE_URL_STAGING" -v "$GITHUB_WORKSPACE":/work -w /work postgres:18 sh -c 'pg_restore --verbose --clean --if-exists --no-owner --no-acl --dbname="$DATABASE_URL" backup.dump'

      - name: Cleanup
        if: always()
        run: |
          rm -f artifact.zip backup.dump backup.dump.enc || true

      - name: Report
        run: echo "Restore finished"
