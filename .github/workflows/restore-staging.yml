name: Restore latest DB backup to staging

on: [workflow_dispatch]

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip openssl postgresql-client python3 python3-venv python3-pip

      - name: Download latest db-backup artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Installing jq"
          sudo apt-get update -y && sudo apt-get install -y jq
          echo "Listing artifacts via GitHub API"
          ARTIFACTS_JSON=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts")
          ART_ID=$(echo "$ARTIFACTS_JSON" | jq -r '.artifacts[] | select(.name|startswith("db-backup-")) | .id' | head -n1)
          if [ -z "$ART_ID" ]; then echo "No db-backup artifact found"; exit 2; fi
          echo "Found artifact id: $ART_ID"
          ZIP_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip"
          echo "Downloading artifact.zip"
          curl -L -s -H "Authorization: token $GITHUB_TOKEN" "$ZIP_URL" -o artifact.zip
          echo "Downloaded artifact.zip ($(stat -c%s artifact.zip) bytes)"
      - name: Unpack artifact
        run: |
          unzip -l artifact.zip || true
          unzip -o artifact.zip

      - name: Decrypt backup
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ ! -f backup.dump.enc ]; then echo "No backup.dump.enc found"; ls -la; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in backup.dump.enc -out backup.dump -pass env:BACKUP_ENCRYPTION_KEY
          ls -lh backup.dump

      - name: Restore to staging
        env:
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          if [ -z "$DATABASE_URL_STAGING" ]; then echo "DATABASE_URL_STAGING not set"; exit 1; fi
          echo "Running pg_restore to $DATABASE_URL_STAGING"
          pg_restore --verbose --no-owner --dbname="$DATABASE_URL_STAGING" backup.dump

      - name: Cleanup
        run: |
          rm -f artifact.zip backup.dump backup.dump.enc || true

      - name: Report
        run: echo "Restore finished"
