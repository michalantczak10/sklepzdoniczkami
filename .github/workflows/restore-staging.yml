name: Restore latest DB backup to staging

on: [workflow_dispatch]

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip openssl postgresql-client python3 python3-venv python3-pip

      - name: Download latest db-backup artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Installing jq"
          sudo apt-get update -y && sudo apt-get install -y jq
          echo "Listing artifacts via GitHub API (paginated)"
          ZIP_URL=""
          page=1
          while :; do
            resp=$(curl -fS -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=$page")
            candidate=$(echo "$resp" | jq -r '.artifacts | map(select(.name|startswith("db-backup-"))) | if length==0 then "" else (max_by(.created_at) | .archive_download_url) end')
            if [ -n "$candidate" ]; then
              ZIP_URL="$candidate"
              break
            fi
            count=$(echo "$resp" | jq '.artifacts | length')
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page+1))
          done
          if [ -z "$ZIP_URL" ]; then echo "No db-backup artifact found" >&2; exit 2; fi
          echo "Downloading artifact"
          curl -fS -H "Authorization: token $GITHUB_TOKEN" -L "$ZIP_URL" -o artifact.zip
          echo "Downloaded artifact.zip ($(stat -c%s artifact.zip) bytes)"

      - name: Unpack artifact
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          # reject archives with absolute paths or parent directory traversals
          if unzip -Z -1 artifact.zip | grep -E '(^/|(^|/)\.\./)'; then
            echo "Unsafe paths in artifact.zip" >&2
            rm -rf "$tmpdir"
            exit 1
          fi
          unzip -o artifact.zip -d "$tmpdir"
          # move supported files into workspace: v2, v1 and its hmac
          moved=false
          if [ -f "$tmpdir/backup.dump.v2.enc" ]; then
            mv "$tmpdir/backup.dump.v2.enc" .
            moved=true
          fi
          if [ -f "$tmpdir/backup.dump.enc" ]; then
            mv "$tmpdir/backup.dump.enc" .
            moved=true
          fi
          if [ -f "$tmpdir/backup.dump.enc.hmac" ]; then
            mv "$tmpdir/backup.dump.enc.hmac" .
            moved=true
          fi
          if [ "$moved" = false ]; then
            echo "No supported backup files found in artifact" >&2
            ls -la "$tmpdir"
            rm -rf "$tmpdir"
            exit 1
          fi
          rm -rf "$tmpdir"

      - name: Detect format and Decrypt backup (v2 preferred)
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_HMAC_KEY: ${{ secrets.BACKUP_HMAC_KEY }}
        run: |
          set -euo pipefail
          if [ -f backup.dump.v2.enc ]; then
            echo "Found v2 AES-GCM artifact, attempting AEAD decrypt"
            if [ -z "${BACKUP_ENCRYPTION_KEY:-}" ]; then echo "BACKUP_ENCRYPTION_KEY not set" >&2; exit 1; fi
            # AES-GCM decrypt (openssl enc will verify tag)
            openssl enc -d -aes-256-gcm -pbkdf2 -in backup.dump.v2.enc -out backup.dump -pass env:BACKUP_ENCRYPTION_KEY
            if [ ! -s backup.dump ]; then echo "backup.dump is missing or empty after v2 decrypt" >&2; exit 2; fi
            chmod 600 backup.dump
          elif [ -f backup.dump.enc ] && [ -f backup.dump.enc.hmac ]; then
            echo "v2 not found; falling back to v1 AES-CBC + HMAC"
            if [ -z "${BACKUP_ENCRYPTION_KEY:-}" ]; then echo "BACKUP_ENCRYPTION_KEY not set" >&2; exit 1; fi
            if [ -z "${BACKUP_HMAC_KEY:-}" ]; then echo "BACKUP_HMAC_KEY not set" >&2; exit 1; fi
            # decode base64 HMAC key into hex
            key_hex=$(echo -n "$BACKUP_HMAC_KEY" | base64 -d | xxd -p -c 256)
            computed_hex=$(openssl dgst -sha256 -mac HMAC -macopt hexkey:$key_hex -binary backup.dump.enc | xxd -p -c 256)
            expected_hex=$(cat backup.dump.enc.hmac | tr -d '\n' | tr -d '\r')
            if [ "$(printf "%s" "$computed_hex" | openssl enc -base64)" != "$(printf "%s" "$expected_hex" | xxd -r -p | openssl enc -base64)" ]; then
              echo "HMAC verification failed" >&2
              exit 2
            fi
            echo "HMAC OK"
            openssl enc -d -aes-256-cbc -pbkdf2 -in backup.dump.enc -out backup.dump -pass env:BACKUP_ENCRYPTION_KEY
            if [ ! -s backup.dump ]; then echo "backup.dump is missing or empty after v1 decrypt" >&2; exit 2; fi
            chmod 600 backup.dump
          else
            echo "No supported backup artifact found (neither v2 nor v1)" >&2
            ls -la
            exit 1
          fi

      - name: Restore to staging (container or host pg_restore)
        env:
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL_STAGING" ]; then echo "DATABASE_URL_STAGING not set"; exit 1; fi
          echo "Running pg_restore (container if docker available, otherwise host pg_restore)"
          # export the DB URL in the shell so it's not interpolated into the docker CLI args
          export DATABASE_URL="$DATABASE_URL_STAGING"
          if command -v docker >/dev/null 2>&1; then
            docker run --rm -e DATABASE_URL -v "$GITHUB_WORKSPACE":/work -w /work postgres:18 sh -c 'pg_restore --verbose --exit-on-error --clean --if-exists --no-owner --no-acl --dbname="$DATABASE_URL" backup.dump'
          else
            echo "docker not found, running pg_restore on host"
            pg_restore --verbose --exit-on-error --clean --if-exists --no-owner --no-acl --dbname="$DATABASE_URL" backup.dump
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f artifact.zip backup.dump backup.dump.enc || true

      - name: Report
        run: echo "Restore finished"
