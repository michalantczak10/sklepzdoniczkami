name: Restore latest DB backup to staging

on:
  workflow_dispatch:
    inputs:
      backup_artifact_run:
        description: "Backup workflow run ID; leave empty to use the newest backup"
        required: false
        type: string
  schedule:
    - cron: "0 3 1 * *"

permissions:
  actions: read
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip openssl postgresql-client jq

      - name: Download db-backup artifact (prefer specific run if provided)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKUP_ARTIFACT_RUN: ${{ inputs.backup_artifact_run }}
        run: |
          set -euo pipefail
          ZIP_URL=""
          if [ -n "${BACKUP_ARTIFACT_RUN:-}" ]; then
            echo "Looking for artifact in run $BACKUP_ARTIFACT_RUN"
            resp=$(curl -fS -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_ARTIFACT_RUN/artifacts")
            ZIP_URL=$(echo "$resp" | jq -r '.artifacts | map(select(.name|startswith("db-backup-package-") or startswith("db-backup-"))) | if length==0 then "" else (sort_by(.created_at) | last | .archive_download_url) end')
          else
            echo "Listing artifacts via GitHub API (paginated)"
            page=1
            while :; do
              resp=$(curl -fS -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=$page")
              candidate=$(echo "$resp" | jq -r '.artifacts | map(select(.name|startswith("db-backup-package-") or startswith("db-backup-"))) | if length==0 then "" else (max_by(.created_at) | .archive_download_url) end')
              if [ -n "$candidate" ]; then
                ZIP_URL="$candidate"
                break
              fi
              count=$(echo "$resp" | jq '.artifacts | length')
              if [ "$count" -lt 100 ]; then
                break
              fi
              page=$((page+1))
            done
          fi
          if [ -z "$ZIP_URL" ]; then echo "No db-backup artifact found" >&2; exit 2; fi
          echo "Downloading artifact from $ZIP_URL"
          curl -fS -H "Authorization: token $GITHUB_TOKEN" -L "$ZIP_URL" -o artifact.zip
          echo "Downloaded artifact.zip ($(stat -c%s artifact.zip) bytes)"

      - name: Unpack artifact
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          # reject archives with absolute paths or parent directory traversals
          if unzip -Z -1 artifact.zip | grep -E '(^/|(^|/)\.\./)'; then
            echo "Unsafe paths in artifact.zip" >&2
            rm -rf "$tmpdir"
            exit 1
          fi
          unzip -o artifact.zip -d "$tmpdir"
          if find "$tmpdir" -maxdepth 1 -type f -name '*.tgz' | grep -q .; then
            package=$(find "$tmpdir" -maxdepth 1 -type f -name '*.tgz' | head -n 1)
            mkdir "$tmpdir/package"
            tar -xzf "$package" -C "$tmpdir/package"
            cp -a "$tmpdir/package/." "$tmpdir/"
          fi
          # move supported files into workspace: v2, v1 and its hmac
          moved=false
          if [ -f "$tmpdir/backup.dump.v2.enc" ]; then
            mv "$tmpdir/backup.dump.v2.enc" .
            moved=true
          fi
          if [ -f "$tmpdir/backup.dump.enc" ]; then
            mv "$tmpdir/backup.dump.enc" .
            moved=true
          fi
          if [ -f "$tmpdir/backup.dump.enc.hmac" ]; then
            mv "$tmpdir/backup.dump.enc.hmac" .
            moved=true
          fi
          if [ -f "$tmpdir/backup.hmac.keyid" ]; then
            mv "$tmpdir/backup.hmac.keyid" .
          fi
          if [ "$moved" = false ]; then
            echo "No supported backup files found in artifact" >&2
            ls -la "$tmpdir"
            rm -rf "$tmpdir"
            exit 1
          fi
          rm -rf "$tmpdir"

      - name: Detect format and Decrypt backup (v2 preferred)
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_HMAC_KEY: ${{ secrets.BACKUP_HMAC_KEY }}
        run: |
          set -euo pipefail
          if [ -f backup.dump.v2.enc ]; then
            echo "Found v2 AES-GCM artifact, attempting AEAD decrypt"
            if [ -z "${BACKUP_ENCRYPTION_KEY:-}" ]; then echo "BACKUP_ENCRYPTION_KEY not set" >&2; exit 1; fi
            # AES-GCM decrypt (openssl enc will verify tag)
            openssl enc -d -aes-256-gcm -pbkdf2 -in backup.dump.v2.enc -out backup.dump -pass env:BACKUP_ENCRYPTION_KEY
            if [ ! -s backup.dump ]; then echo "backup.dump is missing or empty after v2 decrypt" >&2; exit 2; fi
            chmod 600 backup.dump
          elif [ -f backup.dump.enc ] && [ -f backup.dump.enc.hmac ]; then
            echo "v2 not found; falling back to v1 AES-CBC + HMAC"
            if [ -z "${BACKUP_ENCRYPTION_KEY:-}" ]; then echo "BACKUP_ENCRYPTION_KEY not set" >&2; exit 1; fi
            if [ -z "${BACKUP_HMAC_KEY:-}" ]; then echo "BACKUP_HMAC_KEY not set" >&2; exit 1; fi
            # check key id metadata if present
            if [ -f backup.hmac.keyid ]; then
              expected_keyid=$(cat backup.hmac.keyid | tr -d '\n' | tr -d '\r')
              current_keyid=$(echo -n "$BACKUP_HMAC_KEY" | base64 -d | openssl dgst -sha256 -hex | awk '{print $2}' | cut -c1-8)
              echo "artifact key id: $expected_keyid, current key id: $current_keyid"
              if [ "$expected_keyid" != "$current_keyid" ]; then
                echo "Key ID mismatch: artifact signed with different HMAC key. Aborting." >&2
                exit 3
              fi
              echo "Key id matches"
            else
              echo "No backup.hmac.keyid present in artifact; proceeding with HMAC check (legacy)"
            fi
            # decode base64 HMAC key into hex
            key_hex=$(echo -n "$BACKUP_HMAC_KEY" | base64 -d | xxd -p -c 256)
            # diagnostic: list files and compute hashes before HMAC check
            echo "Files in workspace:"; ls -la
            echo "sha256 of encrypted blob:"; sha256sum backup.dump.enc || true
            echo "md5 of encrypted blob:"; md5sum backup.dump.enc || true
            echo "contents of .hmac (trimmed):"; cat backup.dump.enc.hmac | tr -d '\n' | tr -d '\r' | sed -n '1,2p'
            # compute HMAC (hex) over encrypted blob
            computed_hex=$(openssl dgst -sha256 -mac HMAC -macopt hexkey:$key_hex -binary backup.dump.enc | xxd -p -c 256)
            expected_hex=$(cat backup.dump.enc.hmac | tr -d '\n' | tr -d '\r')
            # compare hex-to-hex to avoid double-encoding mismatches
            if [ "$computed_hex" != "$expected_hex" ]; then
              echo "HMAC verification failed" >&2
              echo "computed: $computed_hex" >&2
              echo "expected: $expected_hex" >&2
              exit 2
            fi
            echo "HMAC OK"
            openssl enc -d -aes-256-cbc -pbkdf2 -in backup.dump.enc -out backup.dump -pass env:BACKUP_ENCRYPTION_KEY
            if [ ! -s backup.dump ]; then echo "backup.dump is missing or empty after v1 decrypt" >&2; exit 2; fi
            chmod 600 backup.dump
          else
            echo "No supported backup artifact found (neither v2 nor v1)" >&2
            ls -la
            exit 1
          fi

      - name: Restore to staging (container or host pg_restore)
        env:
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL_STAGING" ]; then echo "DATABASE_URL_STAGING not set"; exit 1; fi
          echo "Running pg_restore (container if docker available, otherwise host pg_restore)"
          # export the DB URL in the shell so it's not interpolated into the docker CLI args
          export DATABASE_URL="$DATABASE_URL_STAGING"
          if command -v docker >/dev/null 2>&1; then
            docker run --rm -e DATABASE_URL -v "$GITHUB_WORKSPACE":/work -w /work postgres:18 sh -c 'pg_restore --verbose --exit-on-error --clean --if-exists --no-owner --no-acl --dbname="$DATABASE_URL" backup.dump'
          else
            echo "docker not found, running pg_restore on host"
            pg_restore --verbose --exit-on-error --clean --if-exists --no-owner --no-acl --dbname="$DATABASE_URL" backup.dump
          fi

      - name: Sanity checks (list tables and row counts)
        env:
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL_STAGING:-}" ]; then echo "DATABASE_URL_STAGING not set; skipping sanity checks"; exit 0; fi
          echo "Listing public tables and row counts (first 100 tables):"
          tables=$(psql "$DATABASE_URL_STAGING" -t -c "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename LIMIT 100;" | awk '{gsub(/^[ \t]+|[ \t]+$/,"",$0); if($0!="") print $0}') || true
          if [ -z "$tables" ]; then echo "No public tables found or query failed"; exit 0; fi
          any_nonzero=0
          for t in $tables; do
            echo "-- Table: $t --"
            cnt=$(psql "$DATABASE_URL_STAGING" -t -c "SELECT count(*) FROM \"$t\";" | tr -d '[:space:]' || echo "0") || true
            echo "rows: $cnt"
            if [ "$cnt" -gt 0 ]; then any_nonzero=1; fi
          done
          if [ "$any_nonzero" -ne 1 ]; then
            echo "Sanity check failed: no public table contains rows" >&2
            exit 2
          fi

      - name: Table-specific assertions (users>=1, products>=1)
        env:
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL_STAGING:-}" ]; then echo "DATABASE_URL_STAGING not set; skipping table assertions"; exit 0; fi
          declare -A expectations=( [users]=1 [products]=1 )
          for tbl in "${!expectations[@]}"; do
            min=${expectations[$tbl]}
            echo "Asserting table $tbl has at least $min rows"
            # allow missing table to fail the assertion
            cnt=$(psql "$DATABASE_URL_STAGING" -t -c "SELECT count(*) FROM \"$tbl\";" 2>/dev/null | tr -d '[:space:]' || echo "0")
            if [ -z "$cnt" ]; then cnt=0; fi
            echo "found $cnt rows in $tbl"
            if [ "$cnt" -lt "$min" ]; then
              echo "Assertion failed: $tbl has $cnt rows, expected >= $min" >&2
              exit 3
            fi
          done

      - name: Cleanup
        if: always()
        run: |
          rm -f artifact.zip backup.dump backup.dump.enc backup.dump.enc.hmac
          rm -f backup.dump.v2.enc backup.hmac.keyid

      - name: Report
        run: echo "Restore finished"
