name: Verify encrypted production backup restore

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: GitHub Actions run ID that created the encrypted production backup
        required: true
        type: string

permissions:
  actions: read

concurrency:
  group: production-backup-restore-test
  cancel-in-progress: false

jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    name: Restore backup in an isolated PostgreSQL instance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_HMAC_KEY: ${{ secrets.BACKUP_HMAC_KEY }}
      BACKUP_RUN_ID: ${{ inputs.backup_run_id }}

    steps:
      - name: Validate inputs and required secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::The backup run ID must contain only digits."
            exit 1
          }
          [[ -n "$BACKUP_ENCRYPTION_KEY" && -n "$BACKUP_HMAC_KEY" ]] || {
            echo "::error::Required backup verification secrets are unavailable."
            exit 1
          }
          echo "BACKUP_RUN_ID=$BACKUP_RUN_ID" >> "$GITHUB_ENV"

      - name: Download encrypted backup artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/backup-restore-test"
          gh run download "$BACKUP_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "db-backup-package-${BACKUP_RUN_ID}.tgz" \
            --dir "$RUNNER_TEMP/backup-restore-test"

      - name: Verify and decrypt backup
        shell: bash
        run: |
          set -euo pipefail
          restore_dir="$RUNNER_TEMP/backup-restore-test"
          package="$restore_dir/db-backup-files-${BACKUP_RUN_ID}.tgz"
          [[ -s "$package" ]] || {
            echo "::error::The expected encrypted backup package was not found."
            exit 1
          }

          mapfile -t archive_files < <(tar -tzf "$package")
          [[ "${#archive_files[@]}" -eq 3 ]] || {
            echo "::error::The backup package contains an unexpected file set."
            exit 1
          }
          for archive_file in "${archive_files[@]}"; do
            case "$archive_file" in
              backup.dump.enc|backup.dump.enc.hmac|backup.hmac.keyid) ;;
              *)
                echo "::error::The backup package contains an unexpected path."
                exit 1
                ;;
            esac
          done

          mkdir "$restore_dir/unpacked"
          tar -xzf "$package" -C "$restore_dir/unpacked"
          cd "$restore_dir/unpacked"
          [[ -s backup.dump.enc && ! -L backup.dump.enc &&
            -s backup.dump.enc.hmac && ! -L backup.dump.enc.hmac &&
            -s backup.hmac.keyid && ! -L backup.hmac.keyid ]] || {
            echo "::error::The backup package is missing required files."
            exit 1
          }

          hmac_key_hex="$(printf '%s' "$BACKUP_HMAC_KEY" | base64 --decode | xxd -p -c 256)"
          expected_key_id="$(printf '%s' "$BACKUP_HMAC_KEY" | base64 --decode | openssl dgst -sha256 | awk '{print substr($2, 1, 8)}')"
          actual_key_id="$(tr -d '\r\n' < backup.hmac.keyid)"
          [[ "$actual_key_id" == "$expected_key_id" ]] || {
            echo "::error::The backup HMAC key identifier does not match."
            exit 1
          }

          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$hmac_key_hex" \
            -binary backup.dump.enc | xxd -p -c 256 > expected.hmac
          cmp --silent expected.hmac backup.dump.enc.hmac || {
            echo "::error::The backup HMAC verification failed."
            exit 1
          }

          openssl enc -d -aes-256-cbc -pbkdf2 -salt \
            -in backup.dump.enc \
            -out backup.dump \
            -pass env:BACKUP_ENCRYPTION_KEY
          docker run --rm \
            --volume "$restore_dir/unpacked:/backup:ro" \
            postgres:18 pg_restore --list /backup/backup.dump > /dev/null
          echo "Verified and decrypted the encrypted backup artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Restore and verify in temporary PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          network="backup-restore-test-${GITHUB_RUN_ID}"
          restore_dir="$RUNNER_TEMP/backup-restore-test/unpacked"

          docker network create "$network"
          docker run --detach \
            --name backup-restore-postgres \
            --network "$network" \
            --network-alias db \
            --env POSTGRES_PASSWORD=restore-test-only \
            --env POSTGRES_DB=restore_test \
            postgres:18

          ready=false
          for attempt in $(seq 1 30); do
            if docker exec backup-restore-postgres pg_isready -U postgres -d restore_test > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]] || {
            echo "::error::Temporary PostgreSQL did not become ready."
            exit 1
          }

          restore_metrics="$(docker run --rm \
            --network "$network" \
            --env PGPASSWORD=restore-test-only \
            --volume "$restore_dir:/backup:ro" \
            postgres:18 sh -euc '
              pg_restore --exit-on-error --no-owner --no-privileges \
                --host=db --username=postgres --dbname=restore_test /backup/backup.dump
              migration_count="$(psql --host=db --username=postgres --dbname=restore_test --tuples-only --no-align \
                --command="SELECT count(*) FROM public.django_migrations")"
              public_table_count="$(psql --host=db --username=postgres --dbname=restore_test --tuples-only --no-align \
                --command="SELECT count(*) FROM information_schema.tables WHERE table_schema = '\''public'\'' AND table_type = '\''BASE TABLE'\''")"
              order_count="$(psql --host=db --username=postgres --dbname=restore_test --tuples-only --no-align \
                --command="SELECT CASE WHEN to_regclass('\''public.sklepzdoniczkami_order'\'') IS NULL THEN -1 ELSE (SELECT count(*) FROM public.sklepzdoniczkami_order) END")"
              case "$migration_count" in ""|*[!0-9]*) exit 1 ;; esac
              case "$public_table_count" in ""|*[!0-9]*) exit 1 ;; esac
              [ "$migration_count" -gt 0 ]
              [ "$public_table_count" -gt 0 ]
              printf "migration_count=%s\npublic_table_count=%s\norder_count=%s\n" \
                "$migration_count" "$public_table_count" "$order_count"
            ')"

          migration_count="$(printf '%s\n' "$restore_metrics" | awk -F= '$1 == "migration_count" {print $2}')"
          public_table_count="$(printf '%s\n' "$restore_metrics" | awk -F= '$1 == "public_table_count" {print $2}')"
          order_count="$(printf '%s\n' "$restore_metrics" | awk -F= '$1 == "order_count" {print $2}')"
          {
            echo "Restored backup from workflow run: $BACKUP_RUN_ID"
            echo "Destination: isolated, temporary PostgreSQL 18 instance; production Neon was not modified."
            echo "Applied migration records: $migration_count"
            echo "Public tables restored: $public_table_count"
            echo "Orders present in restored snapshot: $order_count"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary database and decrypted data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker rm --force backup-restore-postgres > /dev/null 2>&1 || true
          docker network rm "backup-restore-test-${GITHUB_RUN_ID}" > /dev/null 2>&1 || true
          restore_dir="$RUNNER_TEMP/backup-restore-test"
          if [[ -f "$restore_dir/unpacked/backup.dump" ]]; then
            shred --force --remove "$restore_dir/unpacked/backup.dump"
          fi
          rm -rf -- "$restore_dir"
