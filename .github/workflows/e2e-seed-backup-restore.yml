name: "E2E: seed → backup → restore (one job)"

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_HMAC_KEY: ${{ secrets.BACKUP_HMAC_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          missing=0
          for s in DATABASE_URL DATABASE_URL_STAGING BACKUP_ENCRYPTION_KEY BACKUP_HMAC_KEY GITHUB_TOKEN; do
            value=$(printenv "$s" || true)
            if [ -z "$value" ]; then echo "MISSING_SECRET: $s"; missing=1; fi
          done
          if [ "$missing" -eq 1 ]; then echo "One or more required secrets are missing; failing early." >&2; exit 1; fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug info
        run: |
          set -x
          echo "Runner info:"
          uname -a || true
          lsb_release -a 2>/dev/null || cat /etc/os-release || true
          echo "Docker version:"; docker --version || true
          echo "psql version:"; psql --version || true
          echo "openssl version:"; openssl version || true

      - name: Install tools
        run: |
          set -x
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client openssl jq tar unzip

      - name: Seed random data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then echo "DATABASE_URL not set" >&2; exit 1; fi
          echo "Seeding random data..."
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS users (id SERIAL PRIMARY KEY, email TEXT UNIQUE, name TEXT);
          CREATE TABLE IF NOT EXISTS products (id SERIAL PRIMARY KEY, sku TEXT UNIQUE, name TEXT);
          INSERT INTO users (email,name) SELECT md5(random()::text || clock_timestamp()::text) || '@example.com', 'seed' FROM generate_series(1,5) ON CONFLICT DO NOTHING;
          INSERT INTO products (sku,name) SELECT 'SKU-' || substr(md5(random()::text),1,8), 'Product' FROM generate_series(1,5) ON CONFLICT DO NOTHING;
          SQL
          echo "Querying counts and writing workflow-metadata.txt..."
          users_cnt=$(psql "$DATABASE_URL" -t -c "SELECT count(*) FROM users;" | tr -d '[:space:]')
          products_cnt=$(psql "$DATABASE_URL" -t -c "SELECT count(*) FROM products;" | tr -d '[:space:]')
          echo "users_count=$users_cnt" > workflow-metadata.txt
          echo "products_count=$products_cnt" >> workflow-metadata.txt
          echo "users_count=$users_cnt products_count=$products_cnt"
          if [ "${users_cnt:-0}" -lt 1 ] || [ "${products_cnt:-0}" -lt 1 ]; then echo "ERROR: Seed resulted in zero rows (users=$users_cnt products=$products_cnt)" >&2; exit 1; fi

      - name: Create dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "Creating dump..."
          docker run --rm -v "$GITHUB_WORKSPACE":/work -w /work postgres:18 pg_dump --dbname="$DATABASE_URL" -Fc -f backup.dump
          if [ ! -s backup.dump ]; then echo "ERROR: backup.dump empty" >&2; exit 1; fi

      - name: Encrypt + HMAC
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_HMAC_KEY: ${{ secrets.BACKUP_HMAC_KEY }}
        run: |
          set -euo pipefail
          key_hex=$(echo -n "$BACKUP_HMAC_KEY" | base64 -d | xxd -p -c 256)
          openssl enc -aes-256-cbc -pbkdf2 -salt -in backup.dump -out backup.dump.enc -pass env:BACKUP_ENCRYPTION_KEY
          openssl dgst -sha256 -mac HMAC -macopt hexkey:$key_hex -binary backup.dump.enc | xxd -p -c 256 > backup.dump.enc.hmac
          echo "$(echo -n "$BACKUP_HMAC_KEY" | base64 -d | openssl dgst -sha256 -hex | awk '{print $2}' | cut -c1-8)" > backup.hmac.keyid

      - name: Package artifact
        run: |
          tar czf db-backup-files-${{ github.run_id }}.tgz backup.dump.enc backup.dump.enc.hmac backup.hmac.keyid || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-package-${{ github.run_id }}.tgz
          path: db-backup-files-${{ github.run_id }}.tgz

      - name: Download artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Downloading artifact back into job workspace"
          ZIP_URL=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}/artifacts" | jq -r '.artifacts[0].archive_download_url')
          curl -L -H "Authorization: token $GITHUB_TOKEN" -o artifact.zip "$ZIP_URL"
          unzip -o artifact.zip -d artifact-dir || true
          if find artifact-dir -maxdepth 1 -type f -name '*.tgz' | grep -q .; then tar -xzf $(find artifact-dir -maxdepth 1 -type f -name '*.tgz' | head -n1) -C .; fi

      - name: Decrypt and verify HMAC (v1)
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_HMAC_KEY: ${{ secrets.BACKUP_HMAC_KEY }}
        run: |
          set -euo pipefail
          key_hex=$(echo -n "$BACKUP_HMAC_KEY" | base64 -d | xxd -p -c 256)
          computed=$(openssl dgst -sha256 -mac HMAC -macopt hexkey:$key_hex -binary backup.dump.enc | xxd -p -c 256)
          expected=$(cat backup.dump.enc.hmac | tr -d '\n' )
          if [ "$computed" != "$expected" ]; then echo "HMAC mismatch" >&2; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in backup.dump.enc -out backup.dump -pass env:BACKUP_ENCRYPTION_KEY
          if [ ! -s backup.dump ]; then echo "Decrypted dump empty" >&2; exit 1; fi

      - name: Restore to staging
        env:
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL_STAGING:-}" ]; then echo "DATABASE_URL_STAGING not set" >&2; exit 1; fi
          export DATABASE_URL="$DATABASE_URL_STAGING"
          docker run --rm -e DATABASE_URL -v "$GITHUB_WORKSPACE":/work -w /work postgres:18 sh -c 'pg_restore --verbose --exit-on-error --clean --if-exists --no-owner --no-acl --dbname="$DATABASE_URL" backup.dump'

      - name: Sanity checks
        env:
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          set -euo pipefail
          tables=$(psql "$DATABASE_URL_STAGING" -t -c "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename LIMIT 100;" | awk '{gsub(/^[ \t]+|[ \t]+$/,"",$0); if($0!="") print $0}') || true
          if [ -z "$tables" ]; then echo "No public tables found" >&2; exit 2; fi
          any_nonzero=0
          for t in $tables; do
            cnt=$(psql "$DATABASE_URL_STAGING" -t -c "SELECT count(*) FROM \"$t\";" | tr -d '[:space:]' || echo "0")
            echo "$t: $cnt"
            if [ "$cnt" -gt 0 ]; then any_nonzero=1; fi
          done
          if [ "$any_nonzero" -ne 1 ]; then echo "Sanity failed: no rows" >&2; exit 2; fi

      - name: Table assertions
        env:
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          set -euo pipefail
          for tbl in users products; do
            cnt=$(psql "$DATABASE_URL_STAGING" -t -c "SELECT count(*) FROM \"$tbl\";" | tr -d '[:space:]' || echo "0")
            echo "$tbl -> $cnt"
            if [ "$cnt" -lt 1 ]; then echo "Assertion failed: $tbl has $cnt" >&2; exit 3; fi
          done

      - name: Complete
        run: echo "E2E completed"
